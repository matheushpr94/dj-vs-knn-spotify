name: conferir

# Prova barata a cada push: o dado baixado e' o da analise (sha256) e o preparo
# pega o que deveria pegar (casos que precisam falhar). A conferencia completa
# (rodar_tudo.py --conferir) e' longa e roda a mao.
on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python baixar_dados.py
      - run: uv run python src/rodar_tudo.py --conferir p01 p02 p03 p05 selftest_floresta
